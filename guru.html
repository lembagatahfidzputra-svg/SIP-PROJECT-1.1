<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Guru</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ICON -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
    }

    .main{
      padding:20px;
      padding-bottom:100px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .topbar h1{
      font-size:28px;
    }

    .profile{
      background:#1e293b;
      padding:12px 18px;
      border-radius:18px;

      display:flex;
      align-items:center;
      gap:12px;
    }

    .profile img{
      width:50px;
      height:50px;
      border-radius:50%;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      padding:24px;
      border-radius:24px;

      border:1px solid rgba(255,255,255,0.05);

      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .icon{
      width:55px;
      height:55px;
      border-radius:15px;

      display:flex;
      justify-content:center;
      align-items:center;

      margin-bottom:15px;
      font-size:22px;
    }

    .blue{
      background:rgba(56,189,248,0.15);
      color:#38bdf8;
    }

    .green{
      background:rgba(34,197,94,0.15);
      color:#22c55e;
    }

    .orange{
      background:rgba(249,115,22,0.15);
      color:#f97316;
    }

    .purple{
      background:rgba(168,85,247,0.15);
      color:#a855f7;
    }

    .card h3{
      color:#94a3b8;
      font-size:14px;
      margin-bottom:10px;
    }

    .card h2{
      font-size:30px;
      margin-bottom:5px;
    }

    .card p{
      color:#64748b;
      font-size:13px;
    }

    .form-box{
      background:#1e293b;
      margin-top:25px;
      padding:24px;
      border-radius:24px;
    }

    .form-box h2{
      margin-bottom:20px;
    }

    .input-group{
      margin-bottom:16px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      color:#cbd5e1;
      font-size:14px;
    }

    .input-group input,
    .input-group select{
      width:100%;
      padding:14px;

      border:none;
      outline:none;

      border-radius:14px;

      background:#0f172a;
      color:white;
    }

    .btn{
      width:100%;
      padding:14px;

      border:none;
      border-radius:14px;

      background:#38bdf8;
      color:white;

      font-weight:600;
      cursor:pointer;

      transition:.3s;
    }

    .btn:hover{
      background:#0ea5e9;
    }

    .table-box{
      background:#1e293b;
      margin-top:25px;
      padding:24px;
      border-radius:24px;

      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    table th,
    table td{
      padding:14px;
      text-align:left;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    table th{
      color:#94a3b8;
      font-size:14px;
    }

    .bottom-navbar{
      position:fixed;
      bottom:0;
      left:0;

      width:100%;
      height:75px;

      background:#111827;

      display:flex;
      justify-content:space-around;
      align-items:center;

      border-top:1px solid rgba(255,255,255,0.05);
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;

      color:#94a3b8;
      text-decoration:none;
      font-size:12px;

      transition:.3s;
    }

    .nav-item.active,
    .nav-item:hover{
      color:#38bdf8;
    }

    .nav-item i{
      font-size:20px;
    }

  </style>
</head>

<body>

  <div class="main">

    <div class="topbar">

      <div>
        <h1 id="pageTitle">
          Dashboard Guru
        </h1>

        <p style="color:#94a3b8;">
          Monitoring dan input data santri
        </p>
      </div>

      <div class="profile">

        <img src="https://i.pravatar.cc/100">

        <div>
          <h4 id="usernameText">Guru</h4>

          <small style="color:#94a3b8;">
            Guru Al-Qur'an
          </small>
        </div>

      </div>

    </div>

    <div id="content"></div>

  </div>

  <!-- NAVBAR -->

  <div class="bottom-navbar">

    <a href="#" class="nav-item active"
    onclick="showDashboard()">

      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showInput()">

      <i class="fa-solid fa-pen-to-square"></i>
      <span>Input</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showNilai()">

      <i class="fa-solid fa-book"></i>
      <span>Nilai</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showSantri()">

      <i class="fa-solid fa-user-graduate"></i>
      <span>Santri</span>

    </a>

    <a href="#" class="nav-item"
    onclick="logout()">

      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>

    </a>

  </div>

  <script>

    // LOGIN CHECK

    const role = localStorage.getItem("role");
    const username = localStorage.getItem("username");

    if(role !== "guru"){

      window.location.href = "login.html";

    }

    document.getElementById("usernameText")
    .innerText = username;

    // ELEMENT

    const navItems =
    document.querySelectorAll(".nav-item");

    const content =
    document.getElementById("content");

    const pageTitle =
    document.getElementById("pageTitle");

    // ACTIVE MENU

    function setActive(index){

      navItems.forEach(nav => {
        nav.classList.remove("active");
      });

      navItems[index].classList.add("active");

    }

    // DASHBOARD

    function showDashboard(){

      setActive(0);

      pageTitle.innerText =
      "Dashboard Guru";

      content.innerHTML = `

        <div class="cards">

          <div class="card">

            <div class="icon blue">
              <i class="fa-solid fa-user-graduate"></i>
            </div>

            <h3>Total Santri</h3>
            <h2>25</h2>
            <p>Santri binaan aktif</p>

          </div>

          <div class="card">

            <div class="icon green">
              <i class="fa-solid fa-book-quran"></i>
            </div>

            <h3>Progress Hafalan</h3>
            <h2>82%</h2>
            <p>Capaian hafalan santri</p>

          </div>

          <div class="card">

            <div class="icon purple">
              <i class="fa-solid fa-chart-line"></i>
            </div>

            <h3>Nilai Rata-rata</h3>
            <h2>88</h2>
            <p>Nilai ujian Al-Qur'an</p>

          </div>

        </div>

      `;
    }

    // INPUT DATA

    function showInput(){

      setActive(1);

      pageTitle.innerText =
      "Input Data Santri";

      content.innerHTML = `

        <div class="form-box">

          <h2>Form Input Santri</h2>

          <div class="input-group">
            <label>Nama Santri</label>

            <input
            type="text"
            id="namaSantri"
            placeholder="Masukkan nama santri">
          </div>

          <div class="input-group">
            <label>Nilai Ujian Qur'an</label>

            <input
            type="number"
            id="nilaiSantri"
            placeholder="Masukkan nilai">
          </div>

          <div class="input-group">
            <label>Jumlah Hafalan</label>

            <input
            type="text"
            id="hafalanSantri"
            placeholder="Contoh: Juz 1">
          </div>

          <div class="input-group">
            <label>Keterangan</label>

            <select id="keteranganSantri">
              <option>Lancar</option>
              <option>Cukup</option>
              <option>Perlu Bimbingan</option>
            </select>
          </div>

          <button class="btn" onclick="simpanData()">
            Simpan Data
          </button>

        </div>

      `;
    }

    // SIMPAN DATA

    function simpanData(){

      const nama =
      document.getElementById("namaSantri").value;

      const nilai =
      document.getElementById("nilaiSantri").value;

      const hafalan =
      document.getElementById("hafalanSantri").value;

      const keterangan =
      document.getElementById("keteranganSantri").value;

      if(nama === "" || nilai === "" || hafalan === ""){

        alert("Semua data wajib diisi!");
        return;

      }

      let dataSantri =
      JSON.parse(localStorage.getItem("dataSantri")) || [];

      dataSantri.push({

        nama: nama,
        nilai: nilai,
        hafalan: hafalan,
        keterangan: keterangan

      });

      localStorage.setItem(
        "dataSantri",
        JSON.stringify(dataSantri)
      );

      alert("Data berhasil disimpan!");

      document.getElementById("namaSantri").value = "";
      document.getElementById("nilaiSantri").value = "";
      document.getElementById("hafalanSantri").value = "";

    }

    // NILAI

    function showNilai(){

      setActive(2);

      pageTitle.innerText =
      "Data Nilai";

      let dataSantri =
      JSON.parse(localStorage.getItem("dataSantri")) || [];

      let rows = "";

      dataSantri.forEach(data => {

        rows += `

          <tr>
            <td>${data.nama}</td>
            <td>${data.nilai}</td>
            <td>${data.keterangan}</td>
          </tr>

        `;

      });

      content.innerHTML = `

        <div class="table-box">

          <h2 style="margin-bottom:20px;">
            Nilai Santri
          </h2>

          <table>

            <tr>
              <th>Nama</th>
              <th>Nilai</th>
              <th>Status</th>
            </tr>

            ${rows}

          </table>

        </div>

      `;
    }

    // SANTRI

    function showSantri(){

      setActive(3);

      pageTitle.innerText =
      "Data Santri";

      let dataSantri =
      JSON.parse(localStorage.getItem("dataSantri")) || [];

      let rows = "";

      dataSantri.forEach(data => {

        rows += `

          <tr>
            <td>${data.nama}</td>
            <td>${data.hafalan}</td>
          </tr>

        `;

      });

      content.innerHTML = `

        <div class="table-box">

          <h2 style="margin-bottom:20px;">
            Data Santri
          </h2>

          <table>

            <tr>
              <th>Nama</th>
              <th>Hafalan</th>
            </tr>

            ${rows}

          </table>

        </div>

      `;
    }

    // LOGOUT

    function logout(){

      localStorage.clear();

      window.location.href = "index.html";

    }

    // HALAMAN PERTAMA

    showDashboard();

  </script>

</body>
</html>
