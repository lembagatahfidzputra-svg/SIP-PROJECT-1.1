<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Kepala Sekolah</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ICON -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
    }

    .main{
      padding:20px;
      padding-bottom:100px;
    }

    /* TOPBAR */

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .topbar h1{
      font-size:28px;
    }

    .profile{
      background:#1e293b;
      padding:12px 18px;
      border-radius:18px;

      display:flex;
      align-items:center;
      gap:12px;
    }

    .profile img{
      width:50px;
      height:50px;
      border-radius:50%;
    }

    /* CARDS */

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      padding:24px;
      border-radius:24px;

      border:1px solid rgba(255,255,255,0.05);

      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .icon{
      width:55px;
      height:55px;
      border-radius:15px;

      display:flex;
      justify-content:center;
      align-items:center;

      margin-bottom:15px;
      font-size:22px;
    }

    .blue{
      background:rgba(56,189,248,0.15);
      color:#38bdf8;
    }

    .green{
      background:rgba(34,197,94,0.15);
      color:#22c55e;
    }

    .orange{
      background:rgba(249,115,22,0.15);
      color:#f97316;
    }

    .purple{
      background:rgba(168,85,247,0.15);
      color:#a855f7;
    }

    .card h3{
      color:#94a3b8;
      font-size:14px;
      margin-bottom:10px;
    }

    .card h2{
      font-size:30px;
      margin-bottom:5px;
    }

    .card p{
      color:#64748b;
      font-size:13px;
    }

    /* SECTION */

    .section{
      background:#1e293b;
      margin-top:25px;
      padding:24px;
      border-radius:24px;
    }

    .section h2{
      margin-bottom:20px;
    }

    .guru-item{
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:14px 0;

      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .status{
      padding:6px 12px;
      border-radius:20px;
      font-size:12px;
    }

    .aktif{
      background:rgba(34,197,94,0.15);
      color:#22c55e;
    }

    .warning{
      background:rgba(249,115,22,0.15);
      color:#f97316;
    }

    /* BOTTOM NAVBAR */

    .bottom-navbar{
      position:fixed;
      bottom:0;
      left:0;

      width:100%;
      height:75px;

      background:#111827;

      display:flex;
      justify-content:space-around;
      align-items:center;

      border-top:1px solid rgba(255,255,255,0.05);
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;

      color:#94a3b8;
      text-decoration:none;
      font-size:12px;

      transition:.3s;
    }

    .nav-item.active,
    .nav-item:hover{
      color:#38bdf8;
    }

    .nav-item i{
      font-size:20px;
    }

  </style>
</head>

<body>

  <div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>
        <h1 id="pageTitle">
          Dashboard Kepala Sekolah
        </h1>

        <p style="color:#94a3b8;">
          Monitoring keseluruhan sekolah
        </p>
      </div>

      <div class="profile">

        <img src="https://i.pravatar.cc/100">

        <div>
          <h4 id="usernameText">Kepala Sekolah</h4>

          <small style="color:#94a3b8;">
            Administrator Utama
          </small>
        </div>

      </div>

    </div>

    <!-- CONTENT -->
    <div id="content"></div>

  </div>

  <!-- NAVBAR -->

  <div class="bottom-navbar">

    <a href="#" class="nav-item active"
    onclick="showDashboard()">

      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showGuru()">

      <i class="fa-solid fa-users"></i>
      <span>Guru</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showSantri()">

      <i class="fa-solid fa-user-graduate"></i>
      <span>Santri</span>

    </a>

    <a href="#" class="nav-item"
    onclick="showLaporan()">

      <i class="fa-solid fa-chart-column"></i>
      <span>Laporan</span>

    </a>

    <a href="#" class="nav-item"
    onclick="logout()">

      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>

    </a>

  </div>

  <!-- JAVASCRIPT -->

  <script>
    
    let dataSantri =
JSON.parse(localStorage.getItem("dataSantri")) || [];

    // ======================
    // LOGIN CHECK
    // ======================

    const role = localStorage.getItem("role");
    const username = localStorage.getItem("username");

    if(role !== "kepsek"){

      window.location.href = "login.html";

    }

    document.getElementById("usernameText")
    .innerText = username;

    // ======================
    // ELEMENT
    // ======================

    const navItems =
    document.querySelectorAll(".nav-item");

    const content =
    document.getElementById("content");

    const pageTitle =
    document.getElementById("pageTitle");

    // ======================
    // ACTIVE MENU
    // ======================

    function setActive(index){

      navItems.forEach(nav => {
        nav.classList.remove("active");
      });

      navItems[index].classList.add("active");

    }

    // ======================
    // DASHBOARD
    // ======================

    function showDashboard(){

      setActive(0);

      pageTitle.innerText =
      "Dashboard Kepala Sekolah";

      content.innerHTML = `

        <div class="cards">

          <div class="card">

            <div class="icon blue">
              <i class="fa-solid fa-user-graduate"></i>
            </div>

            <h3>Total Santri</h3>
            <h2>120</h2>
            <p>Santri aktif keseluruhan</p>

          </div>

          <div class="card">

            <div class="icon green">
              <i class="fa-solid fa-chalkboard-user"></i>
            </div>

            <h3>Total Guru</h3>
            <h2>15</h2>
            <p>Guru aktif</p>

          </div>

          <div class="card">

            <div class="icon orange">
              <i class="fa-solid fa-book-quran"></i>
            </div>

            <h3>Capaian Hafalan</h3>
            <h2>78%</h2>
            <p>Progress hafalan sekolah</p>

          </div>

          <div class="card">

            <div class="icon purple">
              <i class="fa-solid fa-chart-line"></i>
            </div>

            <h3>Capaian SKL</h3>
            <h2>85%</h2>
            <p>Target pembelajaran</p>

          </div>

        </div>

        <div class="section">

          <h2>Monitoring Guru</h2>

          <div class="guru-item">

            <div>
              <h4>Ust. Ahmad</h4>
              <small style="color:#94a3b8;">
                Guru Tahfidz
              </small>
            </div>

            <div class="status aktif">
              Aktif
            </div>

          </div>

          <div class="guru-item">

            <div>
              <h4>Ust. Yusuf</h4>
              <small style="color:#94a3b8;">
                Guru Tahsin
              </small>
            </div>

            <div class="status warning">
              Belum Input
            </div>

          </div>

        </div>

      `;
    }

    // ======================
    // GURU
    // ======================

    function showGuru(){

      setActive(1);

      pageTitle.innerText =
      "Data Guru";

      content.innerHTML = `

        <div class="cards">

          <div class="card">

            <div class="icon green">
              <i class="fa-solid fa-users"></i>
            </div>

            <h3>Total Guru</h3>
            <h2>15</h2>
            <p>Guru aktif sekolah</p>

          </div>

          <div class="card">

            <div class="icon blue">
              <i class="fa-solid fa-user-check"></i>
            </div>

            <h3>Guru Aktif</h3>
            <h2>13</h2>
            <p>Sudah input laporan</p>

          </div>

        </div>

      `;
    }

    // ======================
    // SANTRI
    // ======================

    function showSantri(){

      setActive(2);

      pageTitle.innerText =
      "Data Santri";

      content.innerHTML = `

        <div class="cards">

          <div class="card">

            <div class="icon blue">
              <i class="fa-solid fa-user-graduate"></i>
            </div>

            <h3>Total Santri</h3>
            <h2>120</h2>
            <p>Santri aktif keseluruhan</p>

          </div>

          <div class="card">

            <div class="icon purple">
              <i class="fa-solid fa-book-quran"></i>
            </div>

            <h3>Santri Tahfidz</h3>
            <h2>85</h2>
            <p>Program tahfidz aktif</p>

          </div>

        </div>

      `;
    }

    // ======================
    // LAPORAN
    // ======================

    function showLaporan(){

      setActive(3);

      pageTitle.innerText =
      "Laporan Sekolah";

      content.innerHTML = `

        <div class="cards">

          <div class="card">

            <div class="icon orange">
              <i class="fa-solid fa-chart-column"></i>
            </div>

            <h3>Laporan Bulanan</h3>
            <h2>12</h2>
            <p>Total laporan masuk</p>

          </div>

          <div class="card">

            <div class="icon green">
              <i class="fa-solid fa-check"></i>
            </div>

            <h3>Laporan Valid</h3>
            <h2>10</h2>
            <p>Laporan tervalidasi</p>

          </div>

        </div>

      `;
    }

    // ======================
    // LOGOUT
    // ======================

    function logout(){

      localStorage.clear();

      window.location.href = "index.html";

    }

    // ======================
    // HALAMAN PERTAMA
    // ======================

    showDashboard();

  </script>

</body>
</html>
